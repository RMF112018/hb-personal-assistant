# NAS MCP config example (no secrets)
paths:
  application_support_root: /volume2/personal-assistant/app-support

mcp:
  actor: bfetting-via-ssh-launcher
  # Read-only SNAPSHOT of the managed DB (the live production DB is never mounted into the
  # internet-facing MCP). Must match the compose snapshot mount target and satisfy the DB
  # storage guard (/volume2/personal-assistant/.../db/hb-personal-assistant.sqlite). Refresh
  # with deploy/nas/scripts/snapshot-mcp-db.sh; db_tools opens it mode=ro&immutable=1.
  db_path: /volume2/personal-assistant/app-support/mcp-snapshot/db/hb-personal-assistant.sqlite
  # The connected-client staging pipeline writes to a SEPARATE writable workspace DB, pinned via the
  # HB_ASSISTANT_WORKSPACE_DB env in compose (default
  # /volume2/personal-assistant/app-support/mcp-workspace/db/hb-personal-assistant.sqlite). It is
  # isolated from this read-only snapshot; the live prod DB is still never mounted here.
  audit_dir: /app-support/audit/mcp
  limits:
    max_excerpt_bytes: 16384
    max_list_entries: 100
    default_db_rows: 25
    max_db_rows: 100
    max_response_bytes: 256000
    max_write_bytes: 262144
    max_output_file_bytes: 1048576
  roots:
    vault:
      mount: /mnt/vault
      mode: read_write
    home:
      mount: /mnt/roots/home
      mode: read_only
    work:
      mount: /mnt/roots/work
      mode: read_only
    outputs:
      mount: /mnt/outputs
      mode: read_write
  obsidian:
    vault_root: /mnt/vault
    backup_dir: /app-support/audit/mcp/obsidian-backups
    support_dir: /app-support/audit/mcp/obsidian-support
    writes_enabled: true
    vault_markdown_write_enabled: true
    summarization_backend: deterministic
    allowed_write_file_types:
      - md
    # Maps the indexed source-root keys to their read-only mounts so live source reads (prefer_live)
    # resolve the real file instead of degrading to an indexed excerpt (reason: root_unavailable). The
    # source_root_key MUST match what the index was built with (convention: syn-<roots-key>); path is the
    # container mount. sensitive: true keeps a root indexed-only (forces excerpt fallback). If this block
    # is omitted, the runtime derives syn-home/syn-work from the home/work roots automatically.
    external_sources:
      - source_root_key: syn-home
        path: /mnt/roots/home
        sensitive: false
      - source_root_key: syn-work
        path: /mnt/roots/work
        sensitive: false
