models:
  provider: ollama
  external_llms_enabled: false
  roles:
    triage: { model: "qwen3:8b", temperature: 0 }
    extraction: { model: "qwen3:8b", temperature: 0, schema_required: true }
    synthesis: { model: "llama3.1:8b", temperature: 0.2 }
    validator: { model: "qwen3:8b", temperature: 0 }
    embeddings: { model: "nomic-embed-text", enabled_after_deterministic_retrieval: true }
validation:
  require_source_record_ids: true
  reject_missing_confidence: true
