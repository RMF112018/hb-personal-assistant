name: Test Selection Governance

on:
  pull_request:
    paths:
      - '.ai/project-sources/00_AEOS_MASTER_INDEX.md'
      - '.ai/project-sources/07_AEOS_LOCAL_AGENT_OPERATING_CONTRACT.md'
      - '.ai/project-sources/11_REPOSITORY_TEST_SELECTION_STANDARD.md'
      - '.github/ISSUE_TEMPLATE/test-failure.yml'
      - '.github/workflows/test-selection-governance.yml'
      - 'AGENTS.md'
      - 'AI_OPERATING_MANUAL.md'
      - 'CLAUDE.md'
      - 'docs/decisions/**'
      - 'docs/governance/**'
      - 'docs/implementation-plans/github-first-control-plane-migration.md'
      - 'docs/testing/forecasting-and-schedule-test-bundles.md'
      - 'docs/evidence/test-selection-policy/**'
      - 'scripts/test-safe.sh'
      - 'scripts/validate-test-selection-governance.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install validation and collection dependencies
        run: |
          python -m pip install -e '.[dev]'
          python -m pip install -e '.[mcp,analytics-ui]' \
            -e 'subrepos/construction-financial-review[dev]'

      - name: Validate executable syntax
        run: |
          bash -n scripts/test-safe.sh
          python -m py_compile scripts/validate-test-selection-governance.py

      - name: Exercise bounded canonical collection
        env:
          PYTHON: ${{ env.pythonLocation }}/bin/python
        run: |
          set +e
          bash scripts/test-safe.sh --collect-only --python-only 2>&1 | tee pr319-safe-collection.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > pr319-safe-collection.exitcode
          exit 0

      - name: Validate governance contracts at exact head
        run: |
          set +e
          python scripts/validate-test-selection-governance.py validate --github-head-sha '${{ github.event.pull_request.head.sha }}' \
            --github-base-sha '${{ github.event.pull_request.base.sha }}' \
            --pr-number '${{ github.event.pull_request.number }}' \
            --branch-name '${{ github.event.pull_request.head.ref }}' \
            --identity-source 'github-actions-pull-request-event' \
            --collection-log pr319-safe-collection.log \
            --collection-exitcode-file pr319-safe-collection.exitcode \
            --validator-log-name pr319-governance-validator.log \
            --validator-exitcode-name pr319-governance-validator.exitcode \
            --output pr319-governance-validation.partial.json \
            2>&1 | tee pr319-governance-validator.log
          rc=${PIPESTATUS[0]}
          echo "$rc" > pr319-governance-validator.exitcode
          exit 0

      - name: Finalize schema-2 receipt evidence
        if: always()
        run: |
          python scripts/validate-test-selection-governance.py finalize-receipt \
            --input pr319-governance-validation.partial.json \
            --output pr319-governance-validation.json \
            --validator-log pr319-governance-validator.log \
            --validator-exitcode-file pr319-governance-validator.exitcode

      - name: Upload validation and collection evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr319-governance-validation-${{ github.event.pull_request.head.sha }}
          path: |
            pr319-governance-validation.json
            pr319-governance-validation.partial.json
            pr319-governance-validator.log
            pr319-governance-validator.exitcode
            pr319-safe-collection.log
            pr319-safe-collection.exitcode
          if-no-files-found: error

      - name: Enforce receipt and captured evidence consistency
        if: always()
        run: |
          python scripts/validate-test-selection-governance.py verify-receipt \
            --receipt pr319-governance-validation.json \
            --collection-log pr319-safe-collection.log \
            --collection-exitcode-file pr319-safe-collection.exitcode \
            --validator-log pr319-governance-validator.log \
            --validator-exitcode-file pr319-governance-validator.exitcode
