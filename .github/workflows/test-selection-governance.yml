name: Test Selection Governance

on:
  pull_request:
    paths:
      - '.github/workflows/test-selection-governance.yml'
      - 'scripts/validate-test-selection-governance.py'
      - 'docs/evidence/test-selection-policy/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Correct R6 diagnostic-specific fixture
        env:
          GH_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          echo '' | base64 --decode > /tmp/r6-diag-fix.py
          python /tmp/r6-diag-fix.py
          python -m py_compile scripts/validate-test-selection-governance.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/validate-test-selection-governance.py \
            docs/evidence/test-selection-policy/branch-registration.yaml \
            docs/evidence/test-selection-policy/corrective-authorization.md
          git commit -m 'fix: align PR319 qualified reference diagnostics'
          git push origin "HEAD:${GH_BRANCH}"
