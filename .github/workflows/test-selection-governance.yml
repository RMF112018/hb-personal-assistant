name: Test Selection Governance

on:
  pull_request:
    paths:
      - '.github/workflows/test-selection-governance.yml'
      - '.github/r6-bootstrap/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Restore read-only workflow and remove R6 staging
        env:
          GH_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git show 0a619c3a6e502f09988d5fb74c2a3ce62b7adfe7:.github/workflows/test-selection-governance.yml > .github/workflows/test-selection-governance.yml
          rm -rf .github/r6-bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A .github
          git commit -m 'chore: restore read-only PR319 governance workflow'
          git push origin "HEAD:${GH_BRANCH}"
