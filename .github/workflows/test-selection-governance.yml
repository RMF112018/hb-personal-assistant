name: Test Selection Governance

on:
  pull_request:
    paths:
      - '.github/workflows/test-selection-governance.yml'
      - '.github/r5-bootstrap/**'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Remove temporary R5 staging files
        env:
          GH_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name 'OpenAI ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git rm -r .github/r5-bootstrap
          git commit -m 'chore: remove R5 bootstrap staging files'
          git push origin HEAD:"$GH_BRANCH"
