name: Test Selection Governance

on:
  pull_request:
    paths:
      - '.github/workflows/test-selection-governance.yml'
      - '.github/r5-bootstrap/**'
      - 'scripts/validate-test-selection-governance.py'
      - 'docs/evidence/test-selection-policy/**'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact pull-request head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Generate bounded R5 patch diagnostics
        run: |
          set +e
          mkdir -p r5-diagnostic/generated
          cat .github/r5-bootstrap/0* | tr -d '\n' | base64 -d > r5-diagnostic/r5_patch.py 2>r5-diagnostic/base64.stderr
          echo $? > r5-diagnostic/base64.exitcode
          python -m py_compile r5-diagnostic/r5_patch.py >r5-diagnostic/compile.stdout 2>r5-diagnostic/compile.stderr
          echo $? > r5-diagnostic/compile.exitcode
          python r5-diagnostic/r5_patch.py >r5-diagnostic/patch.stdout 2>r5-diagnostic/patch.stderr
          echo $? > r5-diagnostic/patch.exitcode
          cp scripts/validate-test-selection-governance.py r5-diagnostic/generated/ 2>/dev/null
          cp .github/workflows/test-selection-governance.yml r5-diagnostic/generated/ 2>/dev/null
          cp docs/evidence/test-selection-policy/branch-registration.yaml r5-diagnostic/generated/ 2>/dev/null
          cp docs/evidence/test-selection-policy/corrective-authorization.md r5-diagnostic/generated/ 2>/dev/null
          exit 0

      - name: Upload R5 bootstrap diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: pr319-r5-bootstrap-diagnostic-${{ github.event.pull_request.head.sha }}
          path: r5-diagnostic
          if-no-files-found: error
