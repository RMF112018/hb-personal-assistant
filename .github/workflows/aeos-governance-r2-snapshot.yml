name: AEOS Governance R2 Apply

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: aeos-governance-r2-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.head_ref == 'chore/aeos-governance-sync-corrective-r2'
    runs-on: ubuntu-latest
    steps:
      - name: Check out corrective branch
        uses: actions/checkout@v4
        with:
          ref: chore/aeos-governance-sync-corrective-r2
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconstruct source trees and builder
        run: |
          set -euo pipefail
          rm -rf /tmp/aeos-r2-work
          mkdir -p /tmp/aeos-r2-work/current /tmp/aeos-r2-work/pr320
          git archive HEAD | tar -x -C /tmp/aeos-r2-work/current
          git fetch --no-tags origin 3d740dbcfc1d58c86dcce0d2495155e4d83a28e2
          git archive FETCH_HEAD | tar -x -C /tmp/aeos-r2-work/pr320
          cat tools/aeos-r2-builder/part-*.py > /tmp/build_corrective.py
          sed -i "s|Path('/mnt/data/aeos-r2-work')|Path('/tmp/aeos-r2-work')|" /tmp/build_corrective.py
          python -m pip install --disable-pip-version-check PyYAML
          python /tmp/build_corrective.py
      - name: Replace branch tree and remove staging machinery
        run: |
          set -euo pipefail
          rm -rf /tmp/aeos-r2-work/out/tools/aeos-r2-builder
          rm -rf /tmp/aeos-r2-work/out/tools/aeos-r2-payload
          rm -f /tmp/aeos-r2-work/out/.github/workflows/aeos-governance-r2-apply.yml
          rm -f /tmp/aeos-r2-work/out/.github/workflows/aeos-governance-r2-snapshot.yml
          rsync -a --delete --exclude='.git/' /tmp/aeos-r2-work/out/ ./
      - name: Install corrective validation dependencies
        run: python -m pip install --disable-pip-version-check -e ".[dev]"
      - name: Validate corrective candidate
        id: validate
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/aeos-r2-validation
          python -m compileall -q .ai/aeos/bin .ai/agent-skills/_aeos-shared/scripts > /tmp/aeos-r2-validation/compile.log 2>&1; s1=$?
          python .ai/aeos/bin/validate_goal_loop_contracts.py > /tmp/aeos-r2-validation/contracts.log 2>&1; s2=$?
          python .ai/agent-skills/_aeos-shared/scripts/validate_skill_package.py > /tmp/aeos-r2-validation/skills.log 2>&1; s3=$?
          python .ai/aeos/bin/validate_ai_layout.py > /tmp/aeos-r2-validation/layout.log 2>&1; s4=$?
          python .ai/aeos/bin/generate_checksums.py --check > /tmp/aeos-r2-validation/checksums.log 2>&1; s5=$?
          git diff --check > /tmp/aeos-r2-validation/diff-check.log 2>&1; s6=$?
          printf '{"compile":%s,"contracts":%s,"skills":%s,"layout":%s,"checksums":%s,"diff_check":%s}\n' "$s1" "$s2" "$s3" "$s4" "$s5" "$s6" | tee /tmp/aeos-r2-validation/status.json
          failed=0
          for code in "$s1" "$s2" "$s3" "$s4" "$s5" "$s6"; do
            if [ "$code" -ne 0 ]; then failed=1; fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload corrective validation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeos-governance-r2-validation-diagnostics
          path: /tmp/aeos-r2-validation
          if-no-files-found: error
      - name: Enforce validation outcome
        if: steps.validate.outputs.failed != '0'
        run: exit 1
      - name: Commit and push coherent corrective candidate
        id: publish
        if: steps.validate.outputs.failed == '0'
        continue-on-error: true
        run: |
          set +e
          mkdir -p /tmp/aeos-r2-publish
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout HEAD -- .github/workflows
          git add -A
          git diff --cached --stat > /tmp/aeos-r2-publish/staged-stat.log 2>&1
          git diff --cached --name-status > /tmp/aeos-r2-publish/staged-name-status.log 2>&1
          if git diff --cached --quiet; then
            echo "No corrective changes staged" > /tmp/aeos-r2-publish/commit.log
            commit_code=1
            push_code=99
          else
            git commit -m "fix: remediate AEOS governance review blockers" \
              -m "Forward-port compatible PR #320 controls onto accepted post-PR #319 main; enforce strict canonical v2 schemas, bounded legacy v1, semantic validation, mutation fixtures, corrected receipt identity, and current checksums." \
              > /tmp/aeos-r2-publish/commit.log 2>&1
            commit_code=$?
            if [ "$commit_code" -eq 0 ]; then
              git rev-parse HEAD > /tmp/aeos-r2-publish/candidate-head.txt
              git push origin HEAD:chore/aeos-governance-sync-corrective-r2 > /tmp/aeos-r2-publish/push.log 2>&1
              push_code=$?
            else
              push_code=98
              echo "Push skipped because commit failed" > /tmp/aeos-r2-publish/push.log
            fi
          fi
          printf '{"commit":%s,"push":%s}\n' "$commit_code" "$push_code" | tee /tmp/aeos-r2-publish/status.json
          failed=0
          if [ "$commit_code" -ne 0 ] || [ "$push_code" -ne 0 ]; then failed=1; fi
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload corrective publish diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeos-governance-r2-publish-diagnostics
          path: /tmp/aeos-r2-publish
          if-no-files-found: error
      - name: Enforce publish outcome
        if: steps.publish.outputs.failed != '0'
        run: exit 1
