name: AEOS Governance Sync Validation

on:
  push:
    branches:
      - chore/aeos-github-first-governance-sync-pr319
  pull_request:
    branches:
      - chore/proportional-test-selection-policy-v2

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Generate canonical checksums
        run: python3 .ai/aeos/bin/generate_checksums.py

      - name: Validate AEOS skill package
        id: skill
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .ai/agent-skills/_aeos-shared/scripts/validate_skill_package.py 2>&1 | tee aeos-skill-validation.log

      - name: Validate AI layout
        id: layout
        continue-on-error: true
        run: |
          set -o pipefail
          python3 .ai/aeos/bin/validate_ai_layout.py 2>&1 | tee aeos-layout-validation.log

      - name: Upload generated validation package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aeos-validation-package
          path: |
            .ai/CHECKSUMS.txt
            aeos-skill-validation.log
            aeos-layout-validation.log
          if-no-files-found: error

      - name: Enforce validator outcomes
        if: steps.skill.outcome == 'failure' || steps.layout.outcome == 'failure'
        run: exit 1
