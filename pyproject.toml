[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hb-personal-assistant"
version = "1.3.0"
description = "HB Personal Assistant + Work Product Intelligence System (Bobby-only local-first MVP)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Bobby Fetting" }
]
keywords = ["personal-assistant", "microsoft-365", "obsidian", "local-first", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Typing :: Typed",
]

dependencies = [
  "typer[all]>=0.12.3",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "msal>=1.28.0",
  "requests>=2.32.0",
  "cryptography>=42.0",
  "pypdf>=4.0",
  "pdfplumber>=0.11",
  "python-docx>=1.1",
  "openpyxl>=3.1",
  "python-pptx>=0.6.21",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.4.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-requests",  # future proof for graph client
]
# Phase 08A second-brain runtime — opt-in live Claude transport only.
# Lazy-imported inside the live adapter so the base install, migrations, full
# test suite, and mock mode all run with NO cloud-model tooling present
# (local-first default). Prompt 04 extends this with `llama-index-core` when the
# retrieval/orchestration layer begins.
second-brain = [
  "anthropic>=0.40",
]

[project.scripts]
hb-assistant = "hb_assistant.cli.main:cli"

[project.urls]
Homepage = "https://github.com/RMF112018/hb-personal-assistant"
Repository = "https://github.com/RMF112018/hb-personal-assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hb_assistant" = ["py.typed", "resources/json/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100
force-exclude = true
extend-exclude = [
  "src/hb_assistant/classification",
  "src/hb_assistant/files",
  "src/hb_assistant/graph",
  "src/hb_assistant/links",
  "src/hb_assistant/normalize",
  # P05: target scope now under strict (obsidian, retrieval, automation, cli/run, relevant tests narrowed)
  # "src/hb_assistant/obsidian",
  # "src/hb_assistant/retrieval",
  "src/hb_assistant/store",
  "src/hb_assistant/cli/diagnostics.py",
  "src/hb_assistant/cli/files.py",
  "src/hb_assistant/cli/search.py",
  "src/hb_assistant/cli/auth.py",
  # "src/hb_assistant/cli/run.py",
  "src/hb_assistant/auth",
  "src/hb_assistant/config/__init__.py",
  "src/hb_assistant/config/path_policy.py",
  # "src/hb_assistant/automation/orchestrator.py",
  "scripts/proofs/delegated_graph_capability_proof.py",
  # P05: narrowed blanket tests/** 
  "tests/test_!(actions|automation|obsidian)*.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "SIM", "C4"]
ignore = ["E501"]  # line length handled by formatter if needed

[tool.ruff.lint.isort]
known-first-party = ["hb_assistant"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
strict_optional = true
no_implicit_reexport = true
ignore_missing_imports = true
follow_imports = "skip"
exclude = "(^src/hb_assistant/(files|graph|links|normalize|obsidian|retrieval|store)/)|(^src/hb_assistant/cli/(files|search|diagnostics)\\.py$)"

[[tool.mypy.overrides]]
module = "hb_assistant.*"
ignore_missing_imports = true
ignore_errors = true

[[tool.mypy.overrides]]
module = [
  "hb_assistant.automation.launchd_manager",
  "hb_assistant.config.path_policy",
  "hb_assistant.cli.automation",
  # P05 target scope (now strict)
  "hb_assistant.actions.*",
  "hb_assistant.automation.*",
  "hb_assistant.obsidian.*",
  "hb_assistant.retrieval.context",
  "hb_assistant.cli.actions",
  "hb_assistant.cli.run",
  # Phase 04A Prompt 01: narrow strict-typing coverage for the live env gate.
  "hb_assistant.procore.live_gate",
  # Phase 08A Prompt 03: strict typing for the second-brain config/adapter surface.
  "hb_assistant.construction.second_brain.*",
]
ignore_errors = false
follow_imports = "normal"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"
markers = [
  "integration: tests that touch external systems; opt-in only",
  "manual: tests intended to be run by an operator by hand",
  "live: tests that perform real Procore HTTP calls; require HB_PROCORE_LIVE=1",
]


[tool.ruff.lint.per-file-ignores]
# P05 resolution: ignore ALL rules for tests outside the exact target list
# so only test_actions*.py, test_automation*.py, test_obsidian*.py are enforced
"tests/test_store_links.py" = ["ALL"]
"tests/test_body_mentions.py" = ["ALL"]
"tests/test_classification.py" = ["ALL"]
"tests/test_auth.py" = ["ALL"]
"tests/test_sensitive_scan_cli.py" = ["ALL"]
"tests/test_graph_clients.py" = ["ALL"]
"tests/test_graph_proof.py" = ["ALL"]
"tests/test_store.py" = ["ALL"]
"tests/test_mutation_lockout.py" = ["ALL"]
"tests/test_files_cli.py" = ["ALL"]
"tests/test_graph*.py" = ["ALL"]
"tests/test_!(actions|automation|obsidian)*.py" = ["ALL"]

[tool.hb_assistant]
# Placeholder for future internal config
