[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hb-personal-assistant"
version = "0.3.0"
description = "HB Personal Assistant + Work Product Intelligence System (Bobby-only local-first MVP)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
  { name = "Bobby Fetting" }
]
keywords = ["personal-assistant", "microsoft-365", "obsidian", "local-first", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: MIT License",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business",
  "Typing :: Typed",
]

dependencies = [
  "typer[all]>=0.12.3",
  "pydantic>=2.7.0",
  "pyyaml>=6.0.1",
  "msal>=1.28.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "ruff>=0.4.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "types-requests",  # future proof for graph client
]

[project.scripts]
hb-assistant = "hb_assistant.cli.main:cli"

[project.urls]
Homepage = "https://github.com/RMF112018/hb-personal-assistant"
Repository = "https://github.com/RMF112018/hb-personal-assistant"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"hb_assistant" = ["py.typed"]

[tool.ruff]
target-version = "py312"
line-length = 100
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["E501"]  # line length handled by formatter if needed

[tool.ruff.lint.isort]
known-first-party = ["hb_assistant"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
strict_optional = true
no_implicit_reexport = true
ignore_missing_imports = true  # relax for typer/pydantic/yaml until stubs mature

[[tool.mypy.overrides]]
module = "hb_assistant.*"
ignore_missing_imports = false

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q --tb=short"

[tool.hb_assistant]
# Placeholder for future internal config
