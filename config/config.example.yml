project:
  name: "HB Personal Assistant + Work Product Intelligence System"
  slug: "hb-personal-assistant"
identity:
  tenant_id: "0e834bd7-628b-42c8-b9ec-ecebc9719be4"
  client_id: "08c399eb-a394-4087-b859-659d493f8dc7"
  delegated_scopes: ["User.Read", "Mail.Read", "Calendars.ReadWrite.Shared", "Files.ReadWrite.All", "offline_access"]
paths:
  application_support_root: "~/Library/Application Support/HB Personal Assistant"
  obsidian_vault: "/Users/bobbyfetting/Documents/Obsidian Vault"
  daily_notes_folder: "Daily Notes"
  ai_outputs_folder: "AI Outputs"
  reference_root: "Work/References"
mail:
  inbound_lookback_days: 5
  sent_lookback_days: 7
  max_body_retrieval_per_run: 75
  max_items_per_run: 25
  persist_full_body: false
calendar:
  window: { start: "yesterday", end: "next_2_business_days" }
  max_items_per_run: 25
files:
  max_file_size_mb_default: 100
  max_file_size_mb_pdf: 250
  max_file_size_mb_office: 100
  max_file_size_mb_cad_export_pdf: 300
  warn_above_mb: 100
  require_manual_approval_above_mb: 300
  parse_timeout_seconds: 180
  ocr_enabled: false
  max_drive_items_per_run: 25
graph:
  max_pages_per_call: 5
automation:
  morning_run:
    time: "05:00"
    timezone: "America/New_York"
    catch_up_if_machine_wakes_after: true
    weekend_behavior: "manual_only"
  launchd:
    executable_path: null
    working_directory: null
    label: null
    python_path: null
  scheduler:
    # Daily source-refresh scheduler (cross-platform; app-level catch-up).
    enabled: true
    schedule_time: "20:00"        # local HH:MM
    timezone: "America/New_York"
    catch_up_on_wake: true
    # Live external reads for the scheduled production job are OFF by default:
    # the job rebuilds local SQLite only. Enable explicitly to perform live reads.
    enable_live_reads: false
    enable_procore_live_reads: false
    enable_graph_live_reads: false
    # Production 20:00 Procore scope. all_mapped includes only registry rows
    # whose status is live-refresh-eligible (pilot or active).
    procore_project_scope: "all_mapped"
    # Optional allowlist. Leave empty to include every eligible mapped project.
    procore_project_keys: []
launcher:
  # Per-environment launcher UI settings. `frontend_url` is resolved when
  # `hb-assistant launcher <env> --open` opens the UI; leave unset to fall back
  # to the Vite/static default (http://127.0.0.1:5173). Dev and Production may
  # point at different URLs.
  dev:
    frontend_url: "http://127.0.0.1:5173"
    frontend_open_timeout_seconds: 30
    # Optional display alias. `frontend_display_name` is shown in launcher output;
    # `frontend_alias_url` is opened ONLY when it health-checks (else the launcher
    # falls back to the routable frontend_url + a warning). The alias must resolve
    # WITHOUT hosts-file edits and WITHOUT port 80 (e.g. a *.localhost name + port).
    frontend_display_name: "HB Assistant (Dev)"
    # frontend_alias_url: "http://hb-dev.localhost:5173"
    backend_port: 8000
  production:
    frontend_url: "http://127.0.0.1:5173"
    frontend_open_timeout_seconds: 30
    frontend_display_name: "HB Assistant"
    # frontend_alias_url: "http://hb.localhost:5173"
    backend_port: 8000
security:
  microsoft_365_writeback_enabled: false
  external_llm_enabled: false
