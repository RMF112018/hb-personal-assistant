# Procore pilot project mapping seed (HB Construction Intelligence Phase 03 Prompt_06).
#
# Canonical mapping of HB project_keys (shared with SharePoint/OneDrive sources)
# to Procore project IDs under primary company 5280.
#
# Guardrails:
# - HB project numbers / internal keys (e.g. patterns like 23-435-01, HB-*, HT-*) live only in hb_project_key / hb_project_number.
# - Procore IDs are always numeric strings (or empty for pending).
# - procore_project_id MUST NOT match HB number pattern (enforced by schema + models).
# - 5280 is the Procore-Company-Id header value for all HB scoped calls (from procore_environments + app profile).
# - No secrets, no tokens, read-only surface.

