version: "1.0.0"
provider_default: ollama
profiles:
  - profile_id: default_extract
    provider: ollama
    model_name: mistral-nemo:12b
    enabled: true
    role: task_commitment_relationship_extraction
    max_context_tokens: 32768
    timeout_seconds: 120
    concurrency_limit: 1
    heavy_profile: false
    requires_explicit_enable: false

  - profile_id: high_recall_extract
    provider: ollama
    model_name: llama3.1:8b
    enabled: true
    role: high_recall_bulk_extraction
    max_context_tokens: 24000
    timeout_seconds: 90
    concurrency_limit: 1
    heavy_profile: false
    requires_explicit_enable: false

  - profile_id: review_filter
    provider: ollama
    model_name: qwen2.5:14b
    enabled: true
    role: secondary_review_and_safety_filter
    max_context_tokens: 24000
    timeout_seconds: 90
    concurrency_limit: 1
    heavy_profile: false
    requires_explicit_enable: false

  - profile_id: quality_reasoning
    provider: ollama
    model_name: gpt-oss:20b
    enabled: false
    role: daily_brief_and_mcp_packet_synthesis
    max_context_tokens: 65536
    timeout_seconds: 180
    concurrency_limit: 1
    heavy_profile: false
    requires_explicit_enable: true

  - profile_id: heavy_context
    provider: ollama
    model_name: qwen3:30b
    enabled: false
    role: manual_on_demand_long_context_synthesis
    max_context_tokens: 65536
    timeout_seconds: 240
    concurrency_limit: 1
    heavy_profile: true
    requires_explicit_enable: true

  # Daily-brief executive synthesis profile. Live benchmark (2026-06-09, real DB copy) pinned
  # mistral-nemo:12b: 2/2 schema-valid @ ~38s/run (1 attempt) vs qwen2.5:14b 1/2 direct @ ~83s
  # (one fell back). Fallback is the proven extractor. See docs/evidence.
  - profile_id: brief_synthesis
    provider: ollama
    model_name: mistral-nemo:12b
    enabled: true
    role: daily_brief_executive_synthesis
    max_context_tokens: 32768
    timeout_seconds: 180
    concurrency_limit: 1
    heavy_profile: false
    requires_explicit_enable: false
fallbacks:
  high_recall_extract: default_extract
  review_filter: default_extract
  quality_reasoning: default_extract
  heavy_context: default_extract
  brief_synthesis: default_extract
guardrails:
  scheduled_heavy_profile_default: false
  raw_prompt_persisted: false
  raw_response_persisted: false
  external_writeback: false
