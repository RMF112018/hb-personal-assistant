# pass / warning / fail_blocking / deferred_not_blocking taxonomy. Structural + safety gates must pass;
# per-surface gates whose V38/V39 substrate ships empty are honestly deferred_not_blocking. Read-only:
# no persistence, no migration, no heavy proof fixtures re-run. Readiness is never overstated.
