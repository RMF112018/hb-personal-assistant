# Phase 08A — daily-brief context builder + review-triage policy (Prompt 11).
#
# Deterministic posture for the Daily Brief Context Builder (daily_brief_agent) and the
# Review Triage Agent (review_triage_agent). The brief is a bounded, source-linked context
# / handoff package — never HTML, never a notification. Assembly is dry-run-first; triage
# prioritization is deterministic (tier -> urgency -> source). Loaded like the research
# packet / context budget seeds (standalone deterministic config; the daily_brief_contract
# owns the brief-section + card-kind vocabulary).
#
# Prompt 37 follow-up: added what_matters_today summary and priority_ranking for construction
# exec usefulness (rank by freshness/recency, review exceptions, meetings, risk/issue/financial
# exposure, stale warnings). Caps and non-spam preserved; always advisory/source-linked language.
version: phase_08a_daily_brief_policy_v1  # + Prompt 37 what_matters + ranking (additive)
brief_assembly:
  dry_run_first: true
  context_from_research_packet: true
  context_from_retrieval_broker: true
  render_html: false
  emit_notifications: false
triage_prioritization:
  # Deterministic review-load ordering: most-restrictive review tier first, then urgency
  # band, then source family (stable tie-break).
  order:
    - review_tier
    - urgency
    - source_family
review_tier_mapping:
  tier_1: source_backed_advisory
  tier_2: review_recommended
  tier_3: mandatory_review_before_action
card_kinds:
  - attention_item
  - meeting
  - project
  - warning
  - review_required
# Prompt 37 — daily brief usefulness (exec summary + ranked priorities for construction exec).
# Deterministic (no model prose in output); composite ranking over existing signals; caps enforced.
what_matters_today:
  max_bullets: 5
  sources: ["high_urgency_attention", "top_warnings", "top_ranked_project_signals"]
  language: "advisory signals only; review exceptions capped; never determinations"
priority_ranking:
  # Score for project signals / what-matters selection. Higher = more prominent.
  # Ties broken by review_tier asc then recency desc (via broker + context).
  weights:
    review_exception: 10
    stale_warning: 5
    meeting_signal: 4
    risk_issue_fin_exposure: 3
    recency_freshness: 2
  # Project signals in ## Project Signals and handoff may be presented in rank order (top first).
  # Review exceptions remain capped at 10 in output (see render).
  cap_top_project_signals_in_summary: 5
# Prompt 12 — generation/apply gate + delivery posture. Apply (writing approved Obsidian
# output) is blocked unless the Output Evaluation Agent (A05) passes and the context is not
# blocked; delivery handoff is local-only and never performs external delivery.
apply_gate:
  require_research_packet: true
  require_evaluation_pass: true
  min_evaluation_score: 1.0
  block_apply_when_context_blocked: true
delivery:
  local_only: true
  eligibility_requires_evaluation_pass: true
  external_delivery_performed: false
  emit_macos_notification: false
  render_html: false
# Prompt 13 — launchd scheduling (dry-run install preview only). The scheduled job runs at
# 20:00 local and generates the FOLLOWING day's brief (day_offset 1) in apply mode. Real
# install / hardening (health checks, retries, weekend logic, alerting) is owned by the
# Phase 08B Automation Health Agent; this phase only previews and documents.
schedule:
  label: com.hb.personal-assistant.second-brain-daily-brief
  time: "20:00"
  day_offset: 1
  command_mode: apply
  weekend_behavior: run
  logs_outside_repo: true
  dry_run_install_only: true
  phase_08b_owns_hardening: true
  automation_health_agent_handoff: true
