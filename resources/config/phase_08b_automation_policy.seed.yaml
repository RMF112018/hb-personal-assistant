# Phase 08B — automation / observability policy seed (Prompt 02).
#
# Declarative policy substrate for the Phase 08B Automation Delivery & Observability work:
# health-check posture, retry/backoff, weekend behavior, alerting (local-only — NEVER an
# external channel), and the structured reason-code vocabulary the future automation-hardening
# evaluator emits. This prompt ships the policy + reason codes; execution (running health checks,
# retries, real launchd install, weekend gating) is owned by a later 08B prompt. Read-only,
# deterministic, no external delivery.
version: phase_08b_automation_policy_v1

health_checks:
  enabled: true
  checks:
    - path_readiness
    - store_readiness
    - schema_at_latest
    - daily_brief_handoff_durable
  fail_reason_code: HEALTH_CHECK_FAILED

retry:
  max_attempts: 3
  backoff_seconds: [60, 300, 900]
  exhausted_reason_code: RETRY_EXHAUSTED
  scheduled_reason_code: RETRY_SCHEDULED
  succeeded_reason_code: RETRY_SUCCEEDED

# Run recovery posture (Prompt 06). The recovery agent detects V29 registry rows left in the
# orphan status (an interrupted run) + stale locks and, in apply mode, recovers them locally.
run_recovery:
  enabled: true
  orphan_status: started
  needed_reason_code: RECOVERY_NEEDED
  not_needed_reason_code: RECOVERY_NOT_NEEDED
  blocked_reason_code: RECOVERY_BLOCKED
  orphaned_reason_code: RUN_ORPHANED
  recovered_reason_code: RUN_RECOVERED

# Freshness observability posture (Prompt 07). Read-only, deterministic; thresholds for the
# source / runtime / retrieval freshness evaluator. No execution, no external delivery.
freshness:
  enabled: true
  source_max_age_hours: 48
  retrieval_max_age_hours: 168
  source_fresh_reason_code: SOURCE_FRESH
  source_stale_reason_code: SOURCE_STALE
  source_unknown_reason_code: SOURCE_FRESHNESS_UNKNOWN
  retrieval_fresh_reason_code: RETRIEVAL_FRESH
  retrieval_stale_reason_code: RETRIEVAL_STALE
  index_missing_reason_code: RETRIEVAL_INDEX_MISSING
  ok_reason_code: OBSERVABILITY_OK
  degraded_reason_code: OBSERVABILITY_DEGRADED

# Daily-brief job-health posture (Prompt 08). Read-only monitoring over the daily_brief_runs
# ledger: is the brief job running on cadence, succeeding, and not degrading?
daily_brief_job_health:
  enabled: true
  max_age_hours: 36
  healthy_statuses: [synthesized]
  healthy_reason_code: JOB_HEALTHY
  degraded_reason_code: JOB_DEGRADED
  stale_reason_code: JOB_STALE
  never_run_reason_code: JOB_NEVER_RUN

# Daily Brief Delivery Agent posture (Prompt 09). Local-only delivery of an approved brief to the
# Obsidian vault (the only channel — external delivery is NEVER permitted). Dry-run by default;
# apply writes the vault note + a metadata-only V31 delivery receipt for idempotency.
daily_brief_delivery:
  enabled: true
  channel: obsidian_vault
  max_age_hours: 36
  never_generated_reason_code: DELIVERY_NEVER_GENERATED
  blocked_reason_code: DELIVERY_BLOCKED
  stale_reason_code: DELIVERY_STALE
  eligible_reason_code: DELIVERY_ELIGIBLE
  completed_reason_code: DELIVERY_COMPLETED
  already_delivered_reason_code: DELIVERY_ALREADY_DELIVERED

# Local HTML Brief Renderer posture (Prompt 10). Renders a self-contained interactive HTML brief
# (inline CSS/JS only — no external assets, no network) to <app_support>/html/ (outside repo + vault).
# Dry-run by default; apply runs a fail-closed external-asset scan + writes a metadata-only V32 receipt.
daily_brief_html_render:
  enabled: true
  output_dir: app_support_html
  max_age_hours: 36
  never_generated_reason_code: HTML_RENDER_NEVER_GENERATED
  blocked_reason_code: HTML_RENDER_BLOCKED
  stale_reason_code: HTML_RENDER_STALE
  eligible_reason_code: HTML_RENDER_ELIGIBLE
  completed_reason_code: HTML_RENDER_COMPLETED
  already_rendered_reason_code: HTML_RENDER_ALREADY_RENDERED
  external_asset_blocked_reason_code: HTML_RENDER_EXTERNAL_ASSET_BLOCKED

# Local macOS notification posture (Prompt 11). Previews (dry-run) and — on apply — emits a LOCAL
# macOS Notification Center banner via osascript (counts only; no raw content). channel is local_macos
# (no external channel). Emission is fail-closed: while emit=false (default) apply never invokes
# osascript (NOTIFY_DISABLED_BY_POLICY), mirroring the launchd dry_run_install_only gate.
daily_brief_notification:
  enabled: true
  channel: local_macos
  emit: false
  max_age_hours: 36
  never_generated_reason_code: NOTIFY_NEVER_GENERATED
  blocked_reason_code: NOTIFY_BLOCKED
  stale_reason_code: NOTIFY_STALE
  eligible_reason_code: NOTIFY_ELIGIBLE
  disabled_by_policy_reason_code: NOTIFY_DISABLED_BY_POLICY
  emitted_reason_code: NOTIFY_EMITTED
  already_emitted_reason_code: NOTIFY_ALREADY_EMITTED

# Brief-open + consolidated status posture (Prompt 12). open-brief runs macOS `open` on a produced
# LOCAL artifact (the delivered vault note or rendered HTML). Dry-run by default; apply is fail-closed
# behind `open` (default false) -> OPEN_DISABLED_BY_POLICY, no `open` invoked. brief-status / receipts
# are read-only over the V31/V32/V33/V34 ledgers.
daily_brief_open:
  enabled: true
  open: false
  default_target: vault
  max_age_hours: 36
  never_generated_reason_code: OPEN_NEVER_GENERATED
  blocked_reason_code: OPEN_BLOCKED
  stale_reason_code: OPEN_STALE
  not_available_reason_code: OPEN_NOT_AVAILABLE
  eligible_reason_code: OPEN_ELIGIBLE
  disabled_by_policy_reason_code: OPEN_DISABLED_BY_POLICY
  completed_reason_code: OPEN_COMPLETED
  already_opened_reason_code: OPEN_ALREADY_OPENED
  status_never_generated_reason_code: STATUS_NEVER_GENERATED
  status_not_delivered_reason_code: STATUS_NOT_DELIVERED
  status_delivered_reason_code: STATUS_DELIVERED
  status_partial_reason_code: STATUS_PARTIAL
  status_complete_reason_code: STATUS_COMPLETE

weekend_behavior: skip          # skip | run
weekend_reason_code: WEEKEND_GATE_SKIPPED

alerting:
  channel: local_only           # local_only only — external delivery is never permitted
  emit: false                   # alerts are recorded locally; never sent externally
  degraded_reason_code: RUN_DEGRADED

launchd:
  dry_run_install_only: true
  not_installed_reason_code: LAUNCHD_NOT_INSTALLED
  schedule_drift_reason_code: SCHEDULE_DRIFT
  installed_ok_reason_code: LAUNCHD_INSTALLED_OK
  disabled_by_policy_reason_code: LAUNCHD_INSTALL_DISABLED_BY_POLICY

# First-run-after-wake catch-up posture (Prompt 04). Declarative: the scheduling agent reports
# whether a catch-up run is owed; it never runs the brief or installs the LaunchAgent.
first_run_after_wake:
  enabled: true
  stale_after_days: 3
  needed_reason_code: CATCH_UP_NEEDED
  not_needed_reason_code: CATCH_UP_NOT_NEEDED
  stale_reason_code: CATCH_UP_STALE

# No-overlap locking posture (Prompt 05). The cross-process exclusion mechanism is an atomic lock
# FILE outside the repo (<app_support>/locks/); a live lock fails closed, a stale lock is reclaimed.
no_overlap_locking:
  enabled: true
  lock_name: morning_automation
  stale_lock_seconds: 3600
  acquired_reason_code: LOCK_ACQUIRED
  overlap_blocked_reason_code: RUN_OVERLAP_BLOCKED
  stale_reclaimed_reason_code: STALE_LOCK_RECLAIMED
  released_reason_code: LOCK_RELEASED
  release_token_mismatch_reason_code: LOCK_RELEASE_TOKEN_MISMATCH

# Run registry + run-step ledger posture (Prompt 05). Metadata-only durable run accounting.
run_registry:
  enabled: true
  registered_reason_code: RUN_REGISTERED
  step_recorded_reason_code: RUN_STEP_RECORDED

# Phase 08B Addendum Prompt 01 — executor policy, stage registry, retry/backoff, weekend/catch-up
# (high-level wiring + policy versions; full details live in the dedicated phase_08b_*_executor*.seed.yaml
# files created in Prompt 01. These sections + new reason codes are additive; the base required_sections
# in the automation policy contract and validate remain unchanged).
automation_executor:
  enabled: true
  policy_version: phase_08b_automation_executor_policy_v1
  stage_registry_version: phase_08b_executor_stage_registry_v1
  retry_backoff_version: phase_08b_retry_backoff_policy_v1
  weekend_catchup_version: phase_08b_weekend_catchup_policy_v1
  dry_run_default: true
  apply_requires_explicit_confirm: true

executor_stage_registry:
  enabled: true
  # See dedicated seed for the full stages map + execution_order.

