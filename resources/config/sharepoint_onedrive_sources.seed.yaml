# Construction-agent source registry seed.
#
# Phase 02 compatibility bridge:
# - Phase 01 records (tropical-sharepoint, hilltop-sharepoint, bobby-onedrive)
#   stay in place verbatim because downstream code (graph resolver, manifests,
#   vault writer, classifier, CLI, fixtures) still references those source_keys.
# - Phase 02 canonical records use the new field names (source_id, source_scope,
#   source_name, folder_path) via Pydantic field aliases. Internal field names
#   on the Python side remain on Phase 01 spelling.
# - Compatibility aliases will be removed only after every downstream reference
#   is migrated to the canonical names.
#
# Guardrails (do not relax in overrides):
# - read_only must remain true (enforced by SourceLocation model).
# - default_policies.copy_originals_to_vault must remain false.
# - default_policies.store_full_text_in_vault_notes must remain false.
# - Add new sources rather than mutating identifiers in-place once resolved.

default_policies:
  read_only: true
  copy_originals_to_vault: false
  store_full_text_in_vault_notes: false
  store_extracted_text_in_sqlite: selective
  store_embeddings: selective
  require_review_for_sensitive: true
  sync_mode: graph_delta

