# Phase 09 Prompt 38/40 — CLI and operator status (resolved surface registry; advisory).
# A read-only, advisory operator-status aggregator exposing a repo-consistent view of every Phase-09
# CLI surface, its status/eval/build/proof command shape, and the rolled-up readiness posture.
# (V39/22 tables; population of manifests/vector/review ok for advisory). Read-only: persists nothing,
# no migration. Readiness is never overstated (production_readiness=false; explicit deferred list;
# safe_advisory vs semantic vs vector categories). Makes no determination; fail-closed.
version: phase_09_operator_status_v1
phase: "09"

# The repo-consistent Phase-09 CLI surface registry. Each surface mirrors a live CLI command path; an
# optional `contract` names its registered Phase-09 contract (logical name); an optional `table` names
# its owning Phase-09 table (row counts come from the read-only schema-status report). `kinds` is the
# repo's actual command shape for that surface (status/build/proof/eval/gates/apply/search/run).
surfaces:
