# Procore HB project mapping.
#
# Pairs HB project_keys (the same keys the SharePoint/OneDrive source
# registry uses) to Procore project IDs under HB company 5280.
#
# Pydantic enforces:
#   * unique hb_project_key and unique non-empty procore_project_id;
#   * status one of pilot | pending | deprecated;
#   * for pilot / deprecated: procore_project_id must be a numeric string
#     (e.g. "2525840") and must NOT match the HB project-number pattern
#     ^\d{2}-\d{3}-\d{2}$ (e.g. "23-435-01") — those identify a different
#     system and would route live audits to the wrong project;
#   * for pending: procore_project_id must be empty (the row documents that
#     an HB project exists but has not yet been mapped to its Procore
#     counterpart; live audits skip pending mappings with verdict
#     'project_not_mapped').
#
# Project keys overlap with the canonical construction source registry
# (resources/config/sharepoint_onedrive_sources.seed.yaml), but the Procore
# mapping side may be a strict subset: when two SharePoint surfaces index the
# same Procore project (e.g. a Phase 01 compat record plus a Phase 02
# canonical SitePages entry), both project_keys live SharePoint-side but
# resolve to one Procore mapping here.

version: 1
company_id: "5280"

projects:
  - hb_project_key: tropical
    procore_project_id: "2525840"
    procore_project_name: "Tropical - S L"
    status: pilot

  - hb_project_key: pga-modern-garage
    procore_project_id: "2091445"
    procore_project_name: "PGA The Modern & Garage"
    status: pilot

  - hb_project_key: alton-hilltop-pbg
    procore_project_id: "2982068"
    procore_project_name: "Alton Hilltop at PBG"
    status: pilot

  - hb_project_key: the-wellington
    procore_project_id: "3215931"
    procore_project_name: "The Wellington"
    status: pilot

  # `hilltop` and `hilltop-gardens` were retired here on 2026-05-29; they were
  # two SharePoint-side aliases for the same Procore project (24-606-01,
  # procore_project_id 2982068), which is already mapped above under
  # hb_project_key `alton-hilltop-pbg`. The two project_keys remain valid on
  # the SharePoint sources side as distinct source surfaces for the same
  # construction project. See
  # docs/evidence/construction-intelligence-phase-04a/19-mapping-consistent-resolution.md.
