  # HB_Construction_Intelligence_Phase_03_Procore_Integration_Package/resources/config/).
  # Phase 04 Prompt 03 lifts the freeform verification_status notes into structured
  # fields (verification_status, official_reference_url, verified_at_utc, verified_by);
  # notes retain the historical trace.

