# Procore endpoint contract — controller policy.
#
# Authoritative. Pydantic enforces:
#   - http_method must be GET (read-only by construction).
#   - status is one of: validated | sensitive_validated | excluded | deferred.
#   - sensitivity is one of: low | medium | high | critical.
#   - endpoint_id values are unique.
#   - Every required category (rfis, submittals, drawings, daily-logs,
#     punch-items, change-events, commitments, prime-contracts, invoices,
#     correspondence, schedule, tasks) MUST have at least one endpoint —
#     missing a category fails load.
#   - The 'correspondence' category MUST carry status='excluded' (hard
#     guardrail; load fails otherwise).
#   - The 'schedule' and 'tasks' categories MUST carry status='deferred'
#     (hard guardrail; load fails otherwise).
#
# This file is the source of truth for the dry-run audit. Edit (or override
# at config/procore_endpoint_contract.yml) to extend coverage without code
# changes.

version: 1
company_id: "5280"
company_display_name: "HB Construction"

endpoints:
  # ---- Phase 03 enrichment (Prompt 01A): modern REST v1.0/v1.1 paths verified against
  # official Procore Developer API Reference (developers.procore.com/reference/rest)
  # via web research + package candidate catalog (unverified seed materialized from
  # HB_Construction_Intelligence_Phase_03_Procore_Integration_Package/resources/config/).
  # All paths updated to official modern forms; original /vapid/ retained in notes for
  # historical trace. All guardrails (GET-only, excluded, deferred, sensitive review
  # routing for financials) preserved exactly. verification_status and official_reference
  # added to notes pending schema extension for structured fields.
  # See docs/evidence/construction-intelligence-phase-03/01A-*.md for full matrix and reconciliation.

  # ---- validated (low / medium sensitivity) -------------------------
  - endpoint_id: list-projects
    http_method: GET
    path_template: /rest/v1.1/projects
    category: foundation
    status: validated
    sensitivity: low
    included_in_phase_01: true
    notes: |
      Modern path from official Procore REST API Reference (v1.1).
      Company-scoped project listing (Procore-Company-Id header or company_id filter).
      Original Phase 1/2 /vapid/projects retained for compatibility trace.
      Reconciled in Prompt 01A against developers.procore.com/reference/rest/projects?version=1.1
      + package unverified candidate. verification_status: official_docs_verified (2026-05).

  - endpoint_id: list-rfis
    http_method: GET
    path_template: /rest/v1.0/projects/{project_id}/rfis
    category: rfis
    status: validated
    sensitivity: low
    included_in_phase_01: true
    notes: |
      Modern path from official Procore REST API Reference.
      Original /vapid/projects/{project_id}/rfis.
      Reconciled Prompt 01A: developers.procore.com/reference/rest/rfis?version=latest
      + package candidate. verification_status: official_docs_verified.

  - endpoint_id: list-submittals
    http_method: GET
    path_template: /rest/v1.0/projects/{project_id}/submittals
    category: submittals
    status: validated
    sensitivity: low
    included_in_phase_01: true
    notes: |
      Modern path. Original /vapid/... . Reconciled Prompt 01A against official reference.
      verification_status: official_docs_verified.

  - endpoint_id: list-drawings
    http_method: GET
    path_template: /rest/v1.0/projects/{project_id}/drawings
    category: drawings
    status: validated
    sensitivity: low
    included_in_phase_01: true
    notes: "Modern path reconciled Prompt 01A. verification_status: official_docs_verified."

  - endpoint_id: list-daily-logs
    http_method: GET
    path_template: /rest/v1.0/projects/{project_id}/daily_logs
    category: daily-logs
    status: validated
    sensitivity: medium
    included_in_phase_01: true
    notes: Modern path + sub-log types (weather, manpower, notes, delays, deliveries) in unverified candidate. Reconciled Prompt 01A.

  - endpoint_id: list-punch-items
    http_method: GET
    path_template: /rest/v1.0/projects/{project_id}/punch_items
    category: punch-items
    status: validated
    sensitivity: low
    included_in_phase_01: true
    notes: "Modern path reconciled Prompt 01A. verification_status: official_docs_verified."

  # ---- sensitive_validated (high sensitivity — financial / contractual)
  - endpoint_id: list-change-events
    http_method: GET
    path_template: /rest/v1.1/change_events
    category: change-events
    status: sensitive_validated
    sensitivity: high
    included_in_phase_01: true
    notes: |
      Modern path (v1.1 /change_events, often project-filtered).
      Original /vapid/projects/{project_id}/change_events.
      High sensitivity — routes to manual review per controller policy (unchanged).
      Reconciled Prompt 01A: developers.procore.com/reference/rest/change-events.
      verification_status: official_docs_verified.

  - endpoint_id: list-commitments
    http_method: GET
    path_template: /rest/v2.0/companies/{company_id}/projects/{project_id}/commitment_contracts
    category: commitments
    status: sensitive_validated
    sensitivity: high
    included_in_phase_01: true
    notes: |
      Newer recommended v2.0 path from official reference (commitment_contracts).
      Original /vapid/projects/{project_id}/commitments.
      High sensitivity — manual review required (unchanged).
      Reconciled Prompt 01A. verification_status: official_docs_verified.

  - endpoint_id: list-prime-contracts
    http_method: GET
    path_template: /rest/v1.0/projects/{project_id}/prime_contracts
    category: prime-contracts
    status: sensitive_validated
    sensitivity: high
    included_in_phase_01: true
    notes: Modern path reconciled Prompt 01A. High sensitivity, manual review (unchanged).

  - endpoint_id: list-invoices
    http_method: GET
    path_template: /rest/v1.1/requisitions
    category: invoices
    status: sensitive_validated
    sensitivity: high
    included_in_phase_01: true
    notes: |
      Invoices/requisitions/payment applications split across resources per official docs.
      Using requisitions as primary for subcontractor invoices (common entry point).
      Original /vapid/projects/{project_id}/invoices.
      High sensitivity — manual review (unchanged). Reconciled Prompt 01A.

  # ---- excluded (hard guardrail — correspondence is not in scope) ---
  - endpoint_id: list-correspondence
    http_method: GET
    path_template: /rest/v1.0/projects/{project_id}/correspondences
    category: correspondence
    status: excluded
    sensitivity: critical
    included_in_phase_01: false
    notes: |
      Modern path per candidate catalog. Status=excluded (hard guardrail) unchanged.
      Never auditable in MVP per policy. verification_status: excluded_by_guardrail.

  # ---- deferred (hard guardrail — schedule / tasks deferred) --------
  - endpoint_id: list-schedule
    http_method: GET
    path_template: /rest/v1.0/projects/{project_id}/schedule
    category: schedule
    status: deferred
    sensitivity: medium
    included_in_phase_01: false
    notes: |
      Modern path per candidate. Status=deferred (hard guardrail) unchanged.
      Deferred to future phase. verification_status: deferred_by_guardrail.

  - endpoint_id: list-tasks
    http_method: GET
    path_template: /rest/v1.0/projects/{project_id}/tasks
    category: tasks
    status: deferred
    sensitivity: medium
    included_in_phase_01: false
    notes: |
      Modern path per candidate. Status=deferred (hard guardrail) unchanged.
      Deferred to future phase. verification_status: deferred_by_guardrail.

  # Note: Broader candidates from the materialized procore_endpoint_reference.phase03_unverified.seed.yaml
  # (company-vendors, cost-codes, WBS, observations, meetings, daily-log sub-types, drawings revisions,
  # budget views/rows/snapshots/modifications/changes, potential-change-orders, direct-costs, etc.)
  # remain in the unverified reference catalog pending full official reconciliation and dry-run in follow-up prompts.
  # The contract above covers the original required categories with modern paths and Phase 01A verification notes.
