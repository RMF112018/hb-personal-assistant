schema_version: 1
goal_id: GOAL-REPLACE-ME
repository:
  path: /absolute/path/recorded-at-runtime
  remote: owner/repository
governing_sources:
  - CLAUDE.md
  - AGENTS.md
  - .ai/project-sources/00_AEOS_MASTER_INDEX.md
authority_order:
  - current_repository_and_runtime_evidence
  - approved_repository_specific_specifications
  - repository_local_policies
